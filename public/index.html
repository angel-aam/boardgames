ir con una de esas cartas. Cada palo se canta una vez por equipo.</li><li><b>Cambiar el triunfo</b> (Arrastrado con 3, y Normal): al ganar una baza, si tienes el <b>7 o el 2 del triunfo</b> y la carta descubierta es más alta, puedes cambiarlos por ella.</li><li><b>Tute:</b> si al salir tienes los <b>4 reyes o los 4 caballos</b> ganas la partida al instante.</li><li><b>Diez de últimas:</b> quien gana la última baza suma 10 puntos. Gana quien más puntos hace (con parejas, la pareja).</li><li><b>Orden de tu mano:</b> el botón de la cabecera alterna entre valor ↑, valor ↓, palo con valor ↑ y palo con valor ↓ (el triunfo cuenta como el palo de más valor).</li></ul>",options:[{k:"mode",name:"Modalidad",vals:["Arrastrado","Normal"],def:0,desc:["Se reparte toda la baraja (13 cartas con 3 jugadores, 10 con 4) y hay que asistir, superar y fallar desde la primera baza. Con 2 jugadores se juega como Normal.","Se reparten 6 cartas y se roba tras cada baza; las obligaciones empiezan cuando se acaba el montón."]}],createEngine:(t,e,a)=>new u(t,e,a),mount:function(a,s){const n=["va","vd","pa","pd"],i={va:"valor ↑",vd:"valor ↓",pa:"palo · valor ↑",pd:"palo · valor ↓"},r={sort:n.includes(store.get("tute.sort2","pa"))?store.get("tute.sort2","pa"):"pa",pub:null,hand:[],mine:0,ok:[],can:{tt:!1,c7:!1,sw:[],cn:[]},sel:-1,pending:!1,lastSeq:null,hold:null,holdT:0},l=t=>a.querySelector(t);a.innerHTML='<div class="tu-opps" id="tuOpps"></div><div class="tu-mid"><div class="tu-deck" id="tuDeck"></div><div class="tu-trick" id="tuTrick"></div></div><div class="tu-status" id="tuStatus"></div><div class="tu-cn" id="tuCn"></div><div class="tu-acts" id="tuActs"></div><div class="hw"><div class="hh" id="tuHh"></div><div class="tu-hand" id="tuHand"></div></div>';const c=t=>{const e=s.tone;"tick"===t?e(720,.05,"triangle",0,.05):"card"===t?(e(260,.07,"square",0,.04),e(380,.05,"triangle",.04,.05)):"bad"===t?e(150,.2,"sawtooth",0,.05):"turn"===t?(e(880,.09,"sine",0,.06),e(1175,.12,"sine",.1,.06)):"take"==
